    <h1>HTML Hyperlinks</h1>

    <h2>1. Basic Hyperlink</h2>
    <a href="https://www.google.com">
        Visit Google
    </a>

    <h2>2. Hyperlink using target="_blank"</h2>
    <a href="https://www.youtube.com" target="_blank">
        Open YouTube in New Tab
    </a>

    <h2>3. Hyperlink using target="_self"</h2>
    <a href="https://www.wikipedia.org" target="_self">
        Open Wikipedia in Same Tab
    </a>

</body>
