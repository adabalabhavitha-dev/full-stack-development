<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>

        .box {

            /* Content */
            width: 300px;
            height: 150px;

            /* Padding */
            padding: 30px;

            /* Border */
            border: 5px solid blue;

            /* Margin */
            margin: 50px;

            /* Background */
            background-color: lightyellow;

            /* Text */
            text-align: center;
        }

    </style>
</head>

<body>

    <h1>CSS Box Model</h1>

    <div class="box">
        This is the Content area.
        <br><br>
        Padding surrounds the content.
        <br>
        Border surrounds the padding.
        <br>
        Margin creates space outside the border.
    </div>

</body>
</html>
