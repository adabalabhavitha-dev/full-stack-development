<!DOCTYPE html>
<html>
<head>
    <title>Font and Text Properties</title>

    <style>

        /* Font Size */
        .size {
            font-size: 30px;
        }

        /* Font Weight */
        .weight {
            font-weight: bold;
        }

        /* Font Style */
        .style {
            font-style: italic;
        }

        /* Text Decoration */
        .decoration {
            text-decoration: underline;
        }

        /* Text Transform */
        .transform {
            text-transform: uppercase;
        }

        /* Text Align */
        .align {
            text-align: center;
        }

    </style>
</head>

<body>

    <h1>CSS Font and Text Properties</h1>

    <p class="size">
        This text demonstrates font-size.
    </p>

    <p class="weight">
        This text demonstrates font-weight.
    </p>

    <p class="style">
        This text demonstrates font-style.
    </p>

    <p class="decoration">
        This text demonstrates text-decoration.
    </p>

    <p class="transform">
        this text demonstrates text-transform.
    </p>

    <p class="align">
        This text demonstrates text-align.
    </p>

</body>
</html>
