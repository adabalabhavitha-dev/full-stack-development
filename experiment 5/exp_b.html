<!DOCTYPE html>
<html>
<head>
    <title>Background Image</title>

    <style>

        body {
            height: 1500px;

            /* Background image */
            background-image: url("https://via.placeholder.com/400x250");

            /* Image does not repeat */
            background-repeat: no-repeat;

            /* Position image halfway down and horizontally center */
            background-position: center 50%;

            /* Image remains fixed when scrolling */
            background-attachment: fixed;

            /* Image size */
            background-size: 400px 250px;

            /* Background color */
            background-color: lightblue;
        }

        h1 {
            text-align: center;
            margin-top: 50px;
        }

        p {
            text-align: center;
            margin-top: 700px;
        }

    </style>
</head>

<body>

    <h1>Background Image Example</h1>

    <p>
        Scroll the page to see that the background image remains fixed.
    </p>

</body>
</html>
