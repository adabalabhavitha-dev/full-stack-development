
<!DOCTYPE html>
<html>
<head>
    <title>Internal and External JavaScript</title>
</head>
<body>
    <h2>JavaScript Example</h2>
    <p id="demo"></p>

    <!-- Internal JavaScript -->
    <script>
        document.getElementById("demo").innerHTML =
            "Hello from Internal JavaScript!";
    </script>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
