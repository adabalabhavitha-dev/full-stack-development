
<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Output Methods</title>
</head>
<body>
    <h2>JavaScript Output Methods</h2>
    <p id="output"></p>

    <script>
        document.write("Hello using document.write()");

        document.getElementById("output").innerHTML =
            "Hello using innerHTML";

        alert("Hello using alert()");

        console.log("Hello using console.log()");
    </script>
</body>
</html>
